{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <title>APTRANSCO Login</title>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5;">
    <div style="background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center;">
        <img src="{% static 'images/logo-f.png' %}" width="150" alt="Logo">
        <h2>Login to Shakti Platform</h2>
        <form action="/home/" method="GET"> <input type="text" placeholder="Username" style="width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
            <input type="password" placeholder="Password" style="width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
            <button type="submit" style="width: 100%; padding: 10px; background: #004a99; color: white; border: none; border-radius: 5px; cursor: pointer;">Login</button>
        </form>
    </div>
</body>
</html>
